name: CI

on:
  push: { branches: [main, master, develop, "release/*"] }
  pull_request: { branches: [main, master, develop] }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_OPTIONS: "--max_old_space_size=4096"

jobs:
  streamlit:
    name: Streamlit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: streamlit } }
    strategy:
      matrix: { python-version: ["3.10", "3.11", "3.12", "3.13"] }
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: streamlit/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libgl1-mesa-dev 2>&1 | tail -3
      - run: pip install -r requirements.txt pytest-cov pytest-json-report ruff mypy bandit
      - run: ruff check . --target-version py310 --line-length 120
      - run: mypy . --ignore-missing-imports || true
      - run: bandit -r . -x tests/ -q || true
      - name: Tests + coverage
        run: |
          python -m pytest tests/ --cov=core --cov=data --cov=utils --cov=reports --cov-branch \
            --cov-report=term-missing --cov-report=xml:coverage.xml -q --tb=short
          python -c "
          import xml.etree.ElementTree as ET, sys
          t = {'core':80,'data':95,'utils':95,'reports':88}
          f = []
          for p in ET.parse('coverage.xml').getroot().findall('.//package'):
            n = p.get('name','')
            for m,v in t.items():
              if n.startswith(m) or n==m:
                r = float(p.get('line-rate',0))*100
                print(f'  {\"✅\" if r>=v else \"❌\"} {n}: {r:.1f}% (≥{v}%)')
                if r<v: f.append(f'{n}: {r:.1f}% < {v}%')
                break
          if f: print(*[f'\n❌ {x}' for x in f]); sys.exit(1)
          else: print('\n✅ All per-module thresholds met!')
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: streamlit/coverage.xml
          if-no-files-found: ignore
      - uses: codecov/codecov-action@v5
        if: matrix.python-version == '3.13' && github.event_name != 'pull_request'
        continue-on-error: true
        with:
          files: streamlit/coverage.xml
          flags: streamlit
          name: sichergleis-streamlit
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  nextjs-frontend:
    name: Next.js (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: nextjs/frontend } }
    strategy:
      matrix: { node-version: ["20", "22"] }
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: nextjs/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint || true
      - run: npx tsc --noEmit || true
      - run: npm run build

  nextjs-backend:
    name: FastAPI (Python 3.12)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: nextjs/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nextjs/backend/requirements.txt
      - run: pip install -r requirements.txt ruff pytest httpx
      - run: ruff check . --line-length 100 || true
      - run: python -m pytest . -q --tb=short || true
