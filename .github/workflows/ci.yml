name: CI

on:
  push: { branches: [main, master, develop, "release/*"] }
  pull_request: { branches: [main, master, develop] }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  streamlit:
    name: Streamlit (Python 3.12)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: streamlit } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: streamlit/requirements.txt
      - run: pip install -r requirements.txt pytest-cov ruff
      - run: ruff check . --target-version py310 --line-length 120 --exit-zero
      - name: Tests
        run: python -m pytest tests/ --cov=core --cov=data --cov=utils --cov=reports --cov-branch --cov-report=term-missing --cov-fail-under=70 -q --tb=short

  nextjs-frontend:
    name: Next.js (Node 22)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: nextjs/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nextjs/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  nextjs-backend:
    name: FastAPI (Python 3.12)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: nextjs/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nextjs/backend/requirements.txt
      - run: pip install -r requirements.txt ruff pytest httpx
      - run: ruff check . --line-length 100 || true
      - run: python -m pytest . -q --tb=short || true
